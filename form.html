<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/default.css" rel="stylesheet">
    <style type="text/css">
      @font-face {
        font-family: 'oswald-regular';
        src: url('fonts/oswald/Oswald-Regular.ttf');
      }
      @font-face {
        font-family: 'oswald-bold';
        src: url('fonts/oswald/Oswald-Bold.ttf');
      }
      @font-face {
        font-family: 'oswald-light';
        src: url('fonts/oswald/Oswald-Light.ttf');
      }
      body {
        font-family: 'oswald-regular', sans-serif;
        background-color: #1cb9c5;
        /*background-color: #2F9BA3;*/
        background-image: url('assets/new_lawyer/backgrounds/BG-texture.png');
        width: 100%;
        height: 100%;
        display: block;
      }
      .form-wrapper::-webkit-scrollbar{
        background-color: transparent !important;
      } 
      .form-wrapper::-webkit-scrollbar-thumb {
        background-color: transparent !important;
      }
      .form-wrapper::-webkit-scrollbar-thumb:hover {
        background-color: transparent !important;
      }
      .form-wrapper::-webkit-scrollbar-thumb:active {
        background-color: transparent !important;
      }
      .form-wrapper {
  /*      height: 692px;
        position: absolute;
        width: 575px;*/
/*        margin: 10px;
        padding: 10px;*/
        -webkit-overflow-scrolling: touch !important;
        overflow-y: scroll !important;
        overflow-x: hidden !important;
/*        background-color: #2F9BA3;
        background-image: url('assets/new_lawyer/backgrounds/BG-texture.png');*/
      }
      .main-form {
        margin-top: 20px;
      }
      .main-form-label {
        font-size: 15px;
        color: #fff;
        text-align: left !important;
      }
      .main-form-input, .main-form-text-area {
        border-radius: 0px !important;
        float: right;
        border: 5px solid #0F656C;
        height: 47px;
        font-size: 22px;
        font-weight: bold;
        color: #0F656C;
      }
      .form-group {
        margin-top: 20px;
      }
      .submit-button {
        padding: 0px !important;
        border-radius: 0px !important;
        width: 95px;
        height: 45px;
        background-color: transparent !important;
        border-radius: none !important;
        background-image: url('assets/new_lawyer/twelveth-slide/submit-1.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        border: 0;
        float: right;
        margin-right: 5px;
      }
      .submit-button:hover {
        background-image: url('assets/new_lawyer/twelveth-slide/submit.png');
      }
      .submit-button {
        display: inline-block;
        vertical-align: middle;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        box-shadow: 0 0 1px rgba(0, 0, 0, 0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        -moz-osx-font-smoothing: grayscale;
        -webkit-transition-duration: 0.5s;
        transition-duration: 0.5s;
      }
      .submit-button:hover, .submit-button:focus, .submit-button:active {
        -webkit-transform: scale(1.2);
        transform: scale(1.2);
        -webkit-transition-timing-function: cubic-bezier(0.47, 2.02, 0.31, -0.36);
        transition-timing-function: cubic-bezier(0.47, 2.02, 0.31, -0.36);
      }
      .terms {
        text-align: left;
        font-size: 13px;
        font-weight: bold;
        color: #fff;
      }
      .error {
        border: 5px solid #D00000 !important;
      }
      .help-block {
        color: #fff;
        bottom: 0px !important;
        margin-bottom: -20px !important;
      }
      /*Costumize column for frame*/
/*      .col-sm-4 {
        width: 30% !important;
        float: left !important;
        padding-top: 10px;
      }
      .col-sm-8 {
        float: right !important;
        width: 70% !important;
      }*/
      .col-sm-9 {
        width: 70% !important;
        float: left;
      }
      .col-sm-3 {
        float: right;
        width: 30% !important;
      }
      .modal {
        width: 100% !important;
        padding-right: 0px !important;
      }
      .pop-up {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .pop-up-content {
        height: auto !important;
        min-height: 100% !important;
        border-radius: 0 !important;
        background-color: #1cb9c5;
        background-image: url('assets/new_lawyer/backgrounds/BG-texture.png');
      }
      .modal-header {
        border-bottom: 0px !important;
      }
      .y-rec-2 {
        position: absolute;
        width: 350px;
        left: 50%;
        margin-left: -175px;
        top: 190px;
      }
      .backtotop {
        position: absolute;
        width: 200px;
        left: 50%;
        margin-left: -100px;
        cursor: pointer;
      }
      @media only screen and (orientation:landscape) {
/*        .form-wrapper {
          padding-left: 60px;
          padding-right: 60px;
        }*/
/*      .col-sm-4 {
        width: 25% !important;
        float: left !important;
        padding-top: 10px;
      }
      .col-sm-8 {
        float: right !important;
        width: 75% !important;
      }*/
        .trial-2 {
          width: 50%;
        }
      }
      @media only screen and (orientation:portrait) {
/*        .form-wrapper {
          padding-left: -10px;
          padding-right: -10px;
        }*/
/*      .col-sm-4 {
        width: 30% !important;
        float: left !important;
        padding-top: 10px;
      }
      .col-sm-8 {
        float: right !important;
        width: 70% !important;
      }*/
        .trial-2 {
          width: 80%;
        }
      }
    </style>
    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <!-- Submit Loading -->
    <div class="submit-loading">
      <div class="loader">
        <img src="assets/ELSA_Preloader_v2.gif">
        <h2> Please Wait... </h2>
      </div>
    </div>
    <div class="container">
      <div class="row">
        <div class="col-md-6 col-md-offset-3">  
          <div class="form-wrapper">
            <img src="assets/new_lawyer/twelveth-slide/30-day-trial.png" class="trial-2"> 
            <form class="form-horizontal main-form" id="trial-form" autocomplete="off">
              <input type="hidden" id="client_type" value="New Lawyer">
                <div class="form-group">
                  <label for="first_name" class="col-sm-4 control-label main-form-label">*First Name</label>
                  <div class="col-sm-8" id="first_name_group" >
                    <input type="text" class="form-control main-form-input" name="First Name" id="first_name">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-4 control-label main-form-label">*Last Name</label>
                  <div class="col-sm-8" id="last_name_group">
                    <input type="text" class="form-control main-form-input" name="Last Name" id="last_name">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-4 control-label main-form-label">*Work E-mail</label>
                  <div class="col-sm-8" id="email_group">
                    <input type="email" class="form-control main-form-input" name="Work E-mail" id="email">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-4 control-label main-form-label">*Phone</label>
                  <div class="col-sm-8" id="phone_group">
                    <input type="tel" class="form-control main-form-input" name="Phone" id="phone" >
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-4 control-label main-form-label">*Company Name</label>
                  <div class="col-sm-8" id="company_name_group">
                    <input type="text" class="form-control main-form-input" name="Company Name" id="company_name">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-4 control-label main-form-label">*Position</label>
                  <div class="col-sm-8" id="position_group">
                    <input type="text" class="form-control main-form-input" name="Position" id="position">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-4 control-label main-form-label">Message</label>
                  <div class="col-sm-8">
                    <textarea class="form-control main-form-text-area" name="Message" rows="2" id="message"></textarea>
                  </div>
                </div>
              <div class="form-group">
                <div class="col-sm-9 text-col control-label main-form-label">
                  <p class="terms">
                    By clicking the "Submit" button, you agree to the 30-day trial agreement Terms of Use and Privacy Policy.
                  </p>
                </div>
                <div class="col-sm-3 button-col">
                  <button id="main-submit" class="submit-button" type="submit" class="btn btn-default pull-right">
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" id="thankyou" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
      <div class="modal-dialog pop-up" role="document">
        <div class="modal-content pop-up-content">
          <div class="modal-body">
            <img src="assets/new_lawyer/twelveth-slide/y-rec-2.png" class="y-rec-2 bounceIn animated">
            <a href="index.html">
              <img src="assets/new_lawyer/twelveth-slide/backtotop.png" class="backtotop bounceIn animated">
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" id="termsofservice" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog pop-up" role="document">
          <div class="modal-content pop-up-content-2">
            <div class="modal-body">
              <div class="form-2 boumceIn animated">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><img src="assets/new_lawyer/twelveth-slide/close-form.png" class="close-form"></button>
                <iframe 
                class="scroll-pane" 
                id="termsframe" 
                scrolling="no"
                src="termsandprivacy.html"
                style="border: none;">
                </iframe>
              <div style="display: none;">
                <input type="radio" id="radio-terms" name="radio-terms" value="accept"
                class="accept"> <span class="terms-label"> Accept </span>  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="radio" id="radio-terms" name="radio-terms" value="reject" checked="checked"
                class="reject"> <span class="terms-label">  Reject </span> 
                <button id="btn-terms-submit" type="submit" class="submit-button-terms"  class="btn btn-default pull-right"> Submit
                </button>
              </div>
            </div>
          </div> 
        </div>
      </div>
    </div>
    <div class="modal" id="reject" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
      <div class="modal-dialog pop-up" role="document">
        <div class="modal-content pop-up-content">
          <div class="modal-body">
            <img src="assets/reject-message.png" class="y-rec-2 bounceIn animated">
              <a href="index.html">
                <img src="assets/new_lawyer/twelveth-slide/backtotop.png" class="backtotop bounceIn animated">
              </a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/mobile_post.js"></script>
    <script type="text/javascript">
      function submitTerms() {
        $('#btn-terms-submit').click();}
      function Accept() {
        $('.accept').click();}
      function Reject() {
        $('.reject').click();}
    </script>
  </body>
</html>
